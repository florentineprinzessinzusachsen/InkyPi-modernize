name: Docs link check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --timeout/--max-retries/--retry-wait-time widened for general
          # robustness against transient slow responses. Sites that reliably
          # fail from CI runner IPs specifically (bot-protection, rate
          # limits, auth-walls) are excluded in .lycheeignore instead of
          # being deleted from the docs — see that file for the running list
          # and why each entry is there.
          args: >-
            --no-progress --verbose
            --timeout 30
            --max-retries 5
            --retry-wait-time 5
            README.md docs/**/*.md
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}


