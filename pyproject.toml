[project]
name = "inkypi"
version = "1.3.0"
description = "InkyPi — e-ink dashboard for Raspberry Pi"
requires-python = ">=3.11,<3.14"
# Runtime dependencies mirror install/requirements.in during the uv-lock migration
# window (JTN-616). The source of truth is this pyproject.toml + uv.lock; the
# install/requirements.txt file is regenerated from uv.lock via `uv export`.
dependencies = [
  "flask>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "inky>=2.3,<3; sys_platform == 'linux'",
  "requests>=2.32,<3",
  "urllib3>=2.0,<3",
  "werkzeug>=3.1,<4",
  "pillow>=11.0,<13",
  "pi-heif==1.4.0",
  "tzdata>=2024.1",
  "openai>=2.0,<3",
  "google-genai>=1.14,<2",
  "numpy>=2.0,<3",
  "icalendar>=7.2.2,<8",
  "recurring-ical-events>=3.0,<4",
  "psutil>=7.0,<8",
  "cysystemd>=2.0,<3; sys_platform == 'linux'",
  "waitress>=3.0,<4",
  "feedparser>=6.0,<7",
  "jsonschema>=4.0,<5",
  "astral>=3.0,<4",
  "prometheus-client>=0.21,<1",
]

[tool.uv]
# uv needs to know we support Linux (Pi) + macOS (dev) + arm64/aarch64/armhf wheels.
# A universal resolution covers all supported platforms in a single lockfile.
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'armv7l'",
  "sys_platform == 'linux' and platform_machine == 'armv6l'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.setuptools]
# We only use pyproject.toml for dependency metadata; no packages are published.
packages = []

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = """
(
  mock_display_output
)
"""

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "mock_display_output",
  "src/display/waveshare_epd"
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle
  "F",      # pyflakes
  "I",      # isort (imports)
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "C4",     # flake8-comprehensions
  "PERF",   # perflint
  "PIE",    # flake8-pie
  "RSE",    # flake8-raise
  "DTZ",    # flake8-datetimez
  "RET",    # flake8-return
]
ignore = [
  "E501",   # line length handled by Black
  "B011",   # assert False (used as sentinel in tests)
  "B017",   # pytest.raises(Exception) is acceptable
  "SIM105", # contextlib.suppress — noisy, debatable
  "SIM117", # multiple with statements — stylistic
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally construct naive datetimes for fixture-style assertions and
# deterministic clock stubs. Mirroring production's tz-aware datetime everywhere
# would bloat the suite without exercising new behavior. We still enforce
# timezone-awareness for clock-based calls (now/fromtimestamp/date.today) in
# tests because those drift with host locale and can hide real bugs.
"tests/**" = ["DTZ001", "DTZ002", "DTZ003", "DTZ007"]


[tool.mutmut]
# mutmut 3.x (JTN dependabot bump 2.5.1->3.6.0): paths_to_mutate/tests_dir/
# dict_synonyms/runner are gone. source_paths + pytest_add_cli_args* replace
# them; runner's old shell command is now expressed as extra pytest CLI args
# since 3.x always invokes pytest itself.
source_paths = ["src/app_setup/", "src/blueprints/", "src/utils/", "src/refresh_task/"]
# mutmut chdir's into mutants/ before running pytest, so the relative
# PYTHONPATH=src (set by the workflow) resolves against mutants/src instead
# of the real src/ — and mutants/src only ever mirrors source_paths above.
# pytest_add_cli_args_test_selection runs the WHOLE tests/ tree (not just
# tests touching the mutated shard) as the stats baseline, and most of it
# imports src/ packages outside those four dirs (schemas, benchmarks,
# plugins, display, config, model, ...), so collection fails with
# ModuleNotFoundError before mutmut ever gets to run a single mutant.
# also_copy doesn't affect what gets mutated (still governed by
# source_paths) — it just mirrors the rest of the repo (beyond the four
# mutated dirs) as plain, unmutated files so tests that import from it
# (scripts.render_qa.ui_audit) or read it directly by REPO_ROOT-relative
# path (install/do_update.sh, docs/, translations/, .github/, README.md)
# still resolve inside the sandbox. Keep in sync with any new top-level
# REPO_ROOT-relative reference a test adds — grep tests/ for `REPO_ROOT /`.
also_copy = ["src", "scripts", "install", "docs", "translations", ".github", "README.md", "VERSION"]
pytest_add_cli_args_test_selection = ["tests/"]
# Every test that does monkeypatch.chdir()/os.chdir() fails, but only when
# run as part of mutmut's own full `tests/` stats-collection pass — never
# standalone (even from inside mutants/), and never in CI's actual "tests"
# job (green 3x per Python version, same full tests/ tree, same
# deterministic collection order — no randomization plugin is installed).
# Each failure looks the same: a path that should be repo-root-anchored
# resolves against the test's chdir'd tmp_path instead. Root cause wasn't
# pinned down further (not a real app bug — every one of these tests is
# independently green everywhere else); given there are only three chdir
# call sites total in the suite, deselecting all three here is cheaper and
# safer than leaving the nightly job broken chasing a mutmut-execution-model
# interaction that doesn't reflect real behavior.
pytest_add_cli_args = [
    "-x", "--tb=short", "-q",
    # Checks that pyproject.toml's committed source_paths lists all four
    # dirs — correct against the real, git-tracked file, but the CI workflow
    # rewrites source_paths down to a single shard's dir in place *before*
    # invoking mutmut run, so this fails 3-of-4 shards every single time by
    # construction, not from a real regression. Doesn't touch any mutated
    # code, so excluding it from mutmut's own baseline costs no coverage.
    "--deselect", "tests/test_mutmut_config.py",
    "--deselect", "tests/integration/test_plugin_images_route.py::test_plugin_static_image_route_with_relative_src_dir",
    "--deselect", "tests/unit/test_app_utils.py::test_resolve_path_with_relative_src_dir_ignores_cwd",
    "--deselect", "tests/test_dry_run_plugin.py::test_main_default_output_path",
    # This measures `import inkypi`'s transitive module count against a
    # <750 budget (JTN-606). Under mutmut every mutated app_setup/blueprints/
    # utils/refresh_task module carries per-function trampoline wrapping that
    # imports mutmut itself at module load time — real, expected overhead
    # from running under mutation testing at all, not a dependency
    # regression. 766 modules locally under mutmut vs the ~545 the budget
    # comment describes normally.
    "--deselect", "tests/unit/test_lazy_imports.py::test_inkypi_startup_module_count_is_bounded",
    # The next two both monkeypatch a plugin *instance*'s method (generate_image
    # / a preview-render call) and expect the route handler to call that exact
    # instance so the simulated error propagates into the HTTP response. Both
    # pass standalone and in real CI (3x); only under mutmut's own
    # clean-baseline pass does the route end up using a different, unpatched
    # instance, so the simulated error never fires and the request "succeeds"
    # instead. This looks like a systemic category (not just these two) —
    # anything with this monkeypatch-instance-then-hit-a-route shape is a
    # candidate. If mutation-nightly starts failing on a new test with this
    # same signature (200/success where an error was expected), it's very
    # likely the same root cause: add it here rather than re-diagnosing.
    "--deselect", "tests/integration/test_error_recovery.py::test_plugin_generate_image_timeout",
    "--deselect", "tests/integration/test_jtn_341_clock_preview.py::test_clock_update_preview_runtime_error_returns_400_and_logs",
    "--deselect", "tests/integration/test_jtn_341_clock_preview.py::test_clock_update_preview_unexpected_exception_returns_500_and_logs",
]

[tool.semantic_release]
# Keep BOTH the PEP-621 [project].version and the semantic-release anchor in
# sync on every release. Listing them together means python-semantic-release
# rewrites both TOML keys when bumping, so packaging metadata (pip, uv,
# importlib.metadata) and the VERSION file stay aligned. See JTN-624.
version_toml = [
  "pyproject.toml:project.version",
  "pyproject.toml:tool.semantic_release.version",
]
version = "1.3.0"
branch = "main"
tag_format = "v{version}"
upload_to_pypi = false
# Regenerate VERSION from the canonical pyproject.toml value on each release.
# Using NEW_VERSION (env var exported by python-semantic-release to
# build_command) avoids relying on shell {version} expansion, which PSR does
# NOT perform — the previous `echo '{version}'` wrote the literal placeholder
# into VERSION on every release.
assets = ["VERSION", "uv.lock"]
# Regenerate VERSION from the canonical pyproject.toml value AND refresh uv.lock
# so the inkypi package version in the lockfile tracks the release bump.
# Without `uv lock`, the lockfile drifts from pyproject.toml and the "Lockfile
# drift" CI check fails on every new PR (see JTN-655).
build_command = "printf '%s\\n' \"$NEW_VERSION\" > VERSION && uv lock"


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

