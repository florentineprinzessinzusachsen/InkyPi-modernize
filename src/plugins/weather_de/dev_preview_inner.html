        color: #000000;

        margin-top: 5px;
        margin-bottom: 5px;
        margin-left: 5px;
        margin-right: 5px;

        /* Block-level width:auto naturally fills the containing block minus
           margins, so .container/width:100% chains already worked without
           this. height:auto does the opposite (shrinks to content instead
           of filling), so without an explicit height here, every plugin's
           own height:100% (the norm - see weather.css) resolves against an
           undefined ancestor height and falls back to auto too: the
           dashboard just grows to fit its content instead of being bounded
           to the canvas, silently overflowing past the bottom of the
           display by however much its content exceeds the intended size. */
        height: calc(480px - 5px - 5px);

      afterDatasetsDraw(chart, args, pluginOptions) {
        const { ctx } = chart;
        const rainData = pluginOptions.precipitationData || [];
        const meta = chart.getDatasetMeta(1);

        ctx.save();
        ctx.textAlign = 'center';

        meta.data.forEach((bar, i) => {
          const rainAmount = rainData[i];
          if (rainAmount && rainAmount > threshold) {
            const x = bar.x;
            const y = bar.y;
			const base = bar.base;
			const height = base - y;

			let textY, unitY;

			if (height < 25) {
			  textY = y - 10;
			  unitY = y - 3;
			} else {
			  textY = y + 13;
			  unitY = y + 20;
			}
            ctx.fillStyle = "#000000";
            ctx.fillText(rainAmount.toFixed(2), x, textY);
            ctx.fillText(unit, x, unitY);
          }
        });

        ctx.restore();
      }
    });

    // Sunrise/Sunset moved here (off the metrics list) whenever the graph
    // is enabled - see _extract_sun_times_for_graph(). Offsets are hours
    // from "now" along the same x-axis hourly_forecast/labels use, so a
    // fractional offset needs to be interpolated between its two
    // surrounding category ticks rather than snapped to one.
    function sunMarkerX(chart, offsetHours) {
      if (offsetHours === null || offsetHours === undefined) return null;
      const n = labels.length;
      if (offsetHours < 0 || offsetHours > n - 1) return null;
      const i0 = Math.floor(offsetHours);
      const i1 = Math.min(i0 + 1, n - 1);
      const frac = offsetHours - i0;
      const x0 = chart.scales.x.getPixelForValue(i0);
      const x1 = chart.scales.x.getPixelForValue(i1);
      return x0 + (x1 - x0) * frac;
    }

    Chart.register({
      id: 'sunMarkers',
      afterDatasetsDraw(chart) {
        const { ctx, chartArea: { top, bottom } } = chart;
        const marks = [
          { x: sunMarkerX(chart, sunriseOffset), label: sunriseLabel, glyph: '↑' },
          { x: sunMarkerX(chart, sunsetOffset), label: sunsetLabel, glyph: '↓' },
        ];
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '11px Jost, sans-serif';
        ctx.fillStyle = "#000000";
        ctx.strokeStyle = 'rgba(150,150,150,0.8)';
        ctx.setLineDash([4, 3]);
        marks.forEach(m => {
          if (m.x === null) return;
          ctx.beginPath();
          ctx.moveTo(m.x, top);
          ctx.lineTo(m.x, bottom);
          ctx.stroke();
          ctx.fillText(`${m.glyph} ${m.label}`, m.x, top + 12);
        });
        ctx.restore();
      }
    });

    

    // Regenalarm's own nowcast only ever covers the next couple of hours
    // (see _bucket_regenalarm_by_hour's docstring) - beyond that, fall
    // back to the weather provider's own precipitation-probability value
    // so the bar spans the full 24h instead of just going to 0 once
    // Regenalarm's coverage runs out.
    const hybridRainData = regenIntensity.map((v, i) => v === null ? precipitation[i] : v);

    const rainBarDataset = useRegenalarmRain ? {
      type: 'bar',
      label: 'Rain Intensity (Regenalarm + provider fallback)',
      data: hybridRainData,
      borderColor: 'rgba(30,100,220,1)',
      borderWidth: {
        top: 2,
        right: 0,
        bottom: 0,
        left: 0
      },
      backgroundColor: 'rgba(30,100,220,0.55)',
      yAxisID: 'y1',
      barPercentage: 1.0,
      categoryPercentage: 1.0,
      fill: true,
    } : {
      type: 'bar',
      label: 'Precipitation Probability',
      data: precipitation,
      borderColor: 'rgba(26, 111, 176, 1)', // Semi-transparent blue
      borderWidth: {
        top: 2,
        right: 0,
        bottom: 0,
        left: 0
      },
      yAxisID: 'y1',
      barPercentage: 1.0, // Ensures full width
      categoryPercentage: 1.0,  // Ensures full width
      fill: true, // Enable filling the area under the line
    };

    const chartDatasets = [{
      type: 'line',
      label: 'Hourly Temperature',
      data: temperatures,
      borderColor: 'rgba(241, 122, 36, 0.9)', // Line color
      borderWidth: 2,
      pointRadius: 0, // Hide points
      fill: true, // Enable filling the area under the line
      tension: 0.5
    },
    rainBarDataset,
    ];

    if (useRegenalarmRain) {
      chartDatasets.push({
        type: 'line',
        label: 'Rain Probability',
        data: regenProbability,
        borderColor: 'rgba(210,30,30,0.9)',
        backgroundColor: 'rgba(210,30,30,0.9)',
        borderWidth: 2,
        pointRadius: 2,
        pointBackgroundColor: 'rgba(210,30,30,0.9)',
        spanGaps: false,
        yAxisID: 'y1',
        tension: 0.3,
        fill: false,
      });
    }

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: chartDatasets
      },
      options: {
        layout: {
		  padding: {
		    top: 0,
		    bottom: 0
		  }
        },
		animation: {
          duration: 0, // general animation time
        },
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            ticks: {
              autoSkip: true,
              padding: 10,
              maxRotation: 0, // Prevent label rotation
              minRotation: 0, // Prevent label rotation
              color: "#000000",
              font: {
                family: 'Jost'
              }
            },
            grid: {
              tickLength: 0,
              display: false // Hide x-axis grid
            },
            offset: true,
            gridLines: {
                drawBorder: false,
            }
          },
          y: {
            ticks: {
              padding: 5,
              color: "#000000",
              font: {
                family: 'Jost'
              },
              autoSkip: false,
              callback: function(value, index, values) {
                if (index === values.length-1) return (units != "standard") ? maxTemp + "°" : maxTemp;
                else if (index === 0) return (units != "standard") ? minTemp + "°" : minTemp;
                else return '';
              }
            },
            grid: { display: false },
            min: minTemp,
            max: maxTemp,
          },
          y1: {
            position: 'right',
            grid: { display: false },
            ticks: {
              padding: 0,
              color: "#000000",
              font: {
                family: 'Jost'
              },
              autoSkip: false,
              callback: function(value, index, values) {
                if (index === values.length - 1) return "100%";
                else if (index === 0) return "0%";
                else return '';
              }
            },
            min: 0,
            max: 100,
          }
        },
        plugins: {
          legend: { display: false },
		  
			annotationRain: { precipitationData: rain }
	      
        },
        elements: {
          line: {
            borderJoinStyle: 'round' // Smoother line connection
          }
        }
      }
    });

    chart.update();

    // Now, after the chart is created, we can access the scales
    const gradientStart = chart.scales['y'].getPixelForValue(maxTemp); // Max temperature
    const gradientEnd = chart.scales['y'].getPixelForValue(minTemp);   // Min temperature

    // Create gradient based on y-axis values
    const tempGradient = ctx.createLinearGradient(0, gradientStart, 0, gradientEnd+10);
    tempGradient.addColorStop(0, 'rgba(252,204,5, 0.95)'); // Top of the gradient (max temperature)
    tempGradient.addColorStop(1, 'rgba(252,204,5, 0.01)'); // Bottom of the gradient (min temperature)

    // Update the chart to apply the gradient
    chart.data.datasets[0].backgroundColor = tempGradient;

    // Create gradient based on y-axis values
    const precipitationGradient = ctx.createLinearGradient(0, gradientStart, 0, gradientEnd);
    precipitationGradient.addColorStop(0, 'rgba(26, 111, 176, 0.8)'); // Top of the gradient (max temperature)
    precipitationGradient.addColorStop(1, 'rgba(194, 223, 246, 0)'); // Bottom of the gradient (min temperature)

    if (!useRegenalarmRain) {
      chart.data.datasets[1].backgroundColor = precipitationGradient;
    }

    chart.update();
  });
</script>
