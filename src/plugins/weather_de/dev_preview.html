<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>weather_de dev preview (800x480)</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #2b2b2b;
    font-family: sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
    box-sizing: border-box;
  }
  .frame-wrap {
    box-shadow: 0 0 0 1px #000, 0 8px 24px rgba(0, 0, 0, 0.5);
    line-height: 0;
    flex: none;
  }
  iframe {
    display: block;
    width: 800px;
    height: 480px;
    border: 0;
  }
  .label {
    color: #999;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="frame-wrap">
    <iframe src="dev_preview_inner.html" width="800" height="480"></iframe>
  </div>
  <div class="label">800&times;480 fixed viewport (iframe) - resizing this browser window does not affect it. Edit render/weather_de.css and reload to see changes.</div>
</body>
</html>
