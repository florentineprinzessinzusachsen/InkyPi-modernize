<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>InkyPi Plugin</title>
    {% if inline_styles %}
        {% for css in inline_styles %}
        <style>{{ css | safe }}</style>
        {% endfor %}
    {% else %}
        {% for style in style_sheets %}
        <link rel="stylesheet" href="{{style}}">
        {% endfor %}
    {% endif %}
    <style>
        {% for font in font_faces %}
        @font-face {
            font-family: "{{font.font_family}}";
            font-weight: {{font.font_weight}};
            font-style:  {{font.font_style}};
            src: url({{font.url}}) format("truetype");
        }
        {% endfor %}
    </style>
    </head>
    <body 
        class="
        {% if plugin_settings.selectedFrame == 'Corner' %}corner-frame{% endif %}
        {% if plugin_settings.selectedFrame == 'Top and Bottom' %}top-bottom-frame{% endif %}
        {% if plugin_settings.selectedFrame == 'Rectangle' %}rectangle-frame{% endif %}"
        style="padding: 1.5vw;
        {% if plugin_settings.backgroundOption == 'color' %}
            background-color: {{ plugin_settings.backgroundColor }};
        {% elif plugin_settings.backgroundOption == 'image' %}
            background-image: url('{{ plugin_settings.backgroundImageFile }}');
            background-size: cover;
            background-position: center;
        {% endif %}
        color: {{ plugin_settings.textColor }};

        margin-top: {{ plugin_settings.topMargin or plugin_settings.margin or 5 }}px;
        margin-bottom: {{ plugin_settings.bottomMargin or plugin_settings.margin or 5 }}px;
        margin-left: {{ plugin_settings.leftMargin or plugin_settings.margin or 5 }}px;
        margin-right: {{ plugin_settings.rightMargin or plugin_settings.margin or 5 }}px;

        /* Block-level width:auto naturally fills the containing block minus
           margins, so .container/width:100% chains already worked without
           this. height:auto does the opposite (shrinks to content instead
           of filling), so without an explicit height here, every plugin's
           own height:100% (the norm - see weather.css) resolves against an
           undefined ancestor height and falls back to auto too: the
           dashboard just grows to fit its content instead of being bounded
           to the canvas, silently overflowing past the bottom of the
           display by however much its content exceeds the intended size. */
        height: calc({{ height }}px - {{ plugin_settings.topMargin or plugin_settings.margin or 5 }}px - {{ plugin_settings.bottomMargin or plugin_settings.margin or 5 }}px);
    ">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
